# Nginx configuration for kozy.ryndia.space (kozy.mu)
#
# Install:
#   sudo cp nginx-kozy.ryndia.space.conf /etc/nginx/sites-available/kozy.ryndia.space
#   sudo ln -s /etc/nginx/sites-available/kozy.ryndia.space /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d kozy.ryndia.space
#   sudo nginx -t && sudo systemctl reload nginx
#
# The app container publishes 127.0.0.1:8081 (APP_PORT in .env).

server {
    listen 80;
    listen [::]:80;
    server_name kozy.ryndia.space;

    # Certbot ACME challenges
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name kozy.ryndia.space;

    ssl_certificate /etc/letsencrypt/live/kozy.ryndia.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kozy.ryndia.space/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers ───────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # CSP: Stripe.js needs js.stripe.com (script + frame) and api.stripe.com
    # (connect). Inertia/React and Filament/Livewire need 'unsafe-inline' and
    # 'unsafe-eval' for their runtime; fonts come from Bunny Fonts.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://js.stripe.com; script-src-elem 'self' 'unsafe-inline' https://js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.bunny.net; font-src 'self' data: https://fonts.bunny.net; img-src 'self' data: blob: https:; connect-src 'self' https://api.stripe.com; frame-src 'self' https://js.stripe.com https://hooks.stripe.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self';" always;

    # ── Logging ────────────────────────────────────────────────────
    access_log /var/log/nginx/kozy.ryndia.space-access.log;
    error_log  /var/log/nginx/kozy.ryndia.space-error.log;

    # ── Uploads (property photo galleries) ─────────────────────────
    client_max_body_size 100M;

    # ── Compression ────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    # ── Application ────────────────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        # PDF receipts (dompdf) can be slow on large bookings.
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # Stripe webhooks: no buffering, longer window for retries.
    # NOTE: the app has no webhook route yet — this block is here so the
    # path behaves correctly the moment you add one. Harmless until then.
    location /stripe/webhook {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }

    # Health endpoint — kept out of the access log.
    location = /up {
        access_log off;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hardening: never serve dotfiles through the proxy.
    location ~ /\.(?!well-known) {
        deny all;
    }
}
