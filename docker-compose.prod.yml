# ═══════════════════════════════════════════════════════════════════
# Production stack for kozy.mu — hosted at https://kozy.ryndia.space
# ═══════════════════════════════════════════════════════════════════
#
# Usage:  docker compose -f docker-compose.prod.yml --env-file .env <cmd>
#         (the deploy scripts wrap this for you)
#
# The app listens on 127.0.0.1 only — Nginx on the host terminates TLS
# and reverse-proxies to it (see nginx-kozy.ryndia.space.conf).
# ═══════════════════════════════════════════════════════════════════

name: kozy

services:
    # ── Laravel application (php artisan serve behind supervisord) ──
    app:
        build:
            context: ./vendor/laravel/sail/runtimes/8.4
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP:-1000}'
        image: kozy-8.4/app
        container_name: kozy-app
        restart: unless-stopped
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            # Bound to loopback: only the host Nginx can reach it.
            - '127.0.0.1:${APP_PORT:-8081}:80'
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
            SUPERVISOR_PHP_USER: sail
            XDEBUG_MODE: 'off'
        volumes:
            - '.:/var/www/html'
        networks:
            - kozy
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy
        healthcheck:
            test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1/up >/dev/null || exit 1']
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 60s

    # ── Queue worker (mail notifications, PDF receipts, Stripe sync) ──
    queue:
        image: kozy-8.4/app
        container_name: kozy-queue
        restart: unless-stopped
        command: php artisan queue:work --sleep=3 --tries=3 --backoff=10 --max-time=3600 --max-jobs=500
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
            SUPERVISOR_PHP_USER: sail
        volumes:
            - '.:/var/www/html'
        networks:
            - kozy
        stop_grace_period: 60s
        depends_on:
            app:
                condition: service_started
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy

    # ── Scheduler (php artisan schedule:work) ──
    scheduler:
        image: kozy-8.4/app
        container_name: kozy-scheduler
        restart: unless-stopped
        command: php artisan schedule:work
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
            SUPERVISOR_PHP_USER: sail
        volumes:
            - '.:/var/www/html'
        networks:
            - kozy
        depends_on:
            app:
                condition: service_started

    # ── MySQL 8.0 ──
    mysql:
        image: 'mysql:8.0'
        container_name: kozy-mysql
        restart: unless-stopped
        command:
            - '--character-set-server=utf8mb4'
            - '--collation-server=utf8mb4_unicode_ci'
            - '--max-allowed-packet=64M'
        ports:
            # Loopback only — for `mysql -h 127.0.0.1 -P 3308` admin access.
            - '127.0.0.1:${FORWARD_DB_PORT:-3308}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}'
            MYSQL_DATABASE: '${DB_DATABASE:-kozy}'
            MYSQL_USER: '${DB_USERNAME:-kozy}'
            MYSQL_PASSWORD: '${DB_PASSWORD:?DB_PASSWORD is required}'
        volumes:
            - 'kozy-mysql:/var/lib/mysql'
        networks:
            - kozy
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-p${DB_ROOT_PASSWORD}']
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 30s

    # ── Redis (cache, sessions, queue) ──
    redis:
        image: 'redis:7-alpine'
        container_name: kozy-redis
        restart: unless-stopped
        command:
            - redis-server
            - '--appendonly'
            - 'yes'
            - '--requirepass'
            - '${REDIS_PASSWORD:?REDIS_PASSWORD is required}'
        ports:
            - '127.0.0.1:${FORWARD_REDIS_PORT:-6381}:6379'
        volumes:
            - 'kozy-redis:/data'
        networks:
            - kozy
        healthcheck:
            test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
            interval: 10s
            timeout: 5s
            retries: 5
        environment:
            REDIS_PASSWORD: '${REDIS_PASSWORD}'

networks:
    kozy:
        driver: bridge

volumes:
    kozy-mysql:
        driver: local
    kozy-redis:
        driver: local
